<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DiabloLux | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #ff3366;
      --secondary: #ff6b9d;
      --dark-bg: #0a0a0a;
      --card-bg: #151515;
      --text-primary: #ffffff;
      --text-secondary: #b0b0b0;
      --accent-glow: rgba(255, 51, 102, 0.4);
      --glass-bg: rgba(255, 255, 255, 0.05);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--dark-bg);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Background */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background: radial-gradient(circle at 20% 80%, rgba(120,119,198,0.3) 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, rgba(255,119,198,0.3) 0%, transparent 50%),
                  radial-gradient(circle at 40% 40%, rgba(120,219,255,0.3) 0%, transparent 50%);
      animation: bgShift 20s ease-in-out infinite;
    }

    @keyframes bgShift {
      0%, 100% { transform: scale(1) rotate(0deg); }
      50% { transform: scale(1.1) rotate(180deg); }
    }

    /* Floating Particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      background: var(--primary);
      border-radius: 50%;
      opacity: 0.6;
      animation: float 25s infinite linear;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.6; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }

    /* Main Layout */
    .container {
      display: flex;
      min-height: 100vh;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    /* Enhanced Sidebar */
    .sidebar {
      width: 320px;
      min-height: 100vh;
      background: linear-gradient(145deg, rgba(21,21,21,0.95), rgba(10,10,10,0.95));
      backdrop-filter: blur(20px);
      padding: 50px 30px;
      text-align: center;
      box-shadow: 10px 0 40px rgba(0,0,0,0.5);
      border-right: 1px solid rgba(255,51,102,0.1);
      position: sticky;
      top: 0;
    }

    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      box-shadow: 0 0 40px var(--accent-glow);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 40px var(--accent-glow); }
      50% { transform: scale(1.05); box-shadow: 0 0 60px var(--accent-glow); }
    }

    .sidebar h2 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(45deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }

    .sidebar .title {
      color: var(--text-secondary);
      font-size: 0.95rem;
      font-weight: 400;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .social-links {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin: 30px 0;
    }

    .social-link {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-primary);
      text-decoration: none;
      padding: 12px 20px;
      border-radius: 12px;
      transition: all 0.3s ease;
      border: 1px solid transparent;
      font-weight: 500;
    }

    .social-link:hover {
      background: var(--glass-bg);
      border-color: var(--primary);
      transform: translateX(8px);
      box-shadow: 0 5px 20px var(--accent-glow);
    }

    .social-link i {
      font-size: 1.2rem;
      width: 24px;
    }

    /* Main Content */
    .main {
      flex: 1;
      padding: 60px 40px;
      display: flex;
      flex-direction: column;
    }

    .hero-header {
      margin-bottom: 60px;
    }

    .main h1 {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 20px;
      position: relative;
    }

    .main h1::before {
      content: '';
      position: absolute;
      left: 0;
      bottom: -10px;
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 2px;
    }

    /* Advanced Grid */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      margin-top: 20px;
    }

    .project-card {
      background: linear-gradient(145deg, var(--card-bg), rgba(21,21,21,0.8));
      backdrop-filter: blur(15px);
      border-radius: 24px;
      padding: 35px 25px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
      transition: all 0.4s cubic-bezier(0.23, 1, 0.320, 1);
      cursor: pointer;
    }

    .project-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      transform: scaleX(0);
      transition: transform 0.4s ease;
    }

    .project-card:hover::before {
      transform: scaleX(1);
    }

    .project-card:hover {
      transform: translateY(-15px) rotateX(2deg);
      box-shadow: 0 30px 60px rgba(255,51,102,0.25);
      border-color: rgba(255,51,102,0.3);
    }

    .project-card h3 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text-primary);
    }

    .project-card p {
      color: var(--text-secondary);
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .tech-stack {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .tech-tag {
      background: var(--glass-bg);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--primary);
      border: 1px solid rgba(255,51,102,0.2);
    }

    /* Floating Animation */
    .project-card.animate-float {
      animation: floatUp 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes floatUp {
      0% {
        transform: translateY(30px) scale(0.95);
        opacity: 0;
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }

    /* Scroll Indicators */
    .scroll-indicator {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 50px;
      height: 50px;
      background: var(--primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0.7;
      transition: all 0.3s ease;
      z-index: 1000;
      box-shadow: 0 10px 30px var(--accent-glow);
    }

    .scroll-indicator:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .container {
        flex-direction: column;
      }
      
      .sidebar {
        width: 100%;
        height: auto;
        padding: 40px 20px;
      }
      
      .main {
        padding: 40px 20px;
      }
    }

    @media (max-width: 768px) {
      .projects-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      
      .main h1 {
        font-size: 2.5rem;
      }
    }

    /* Typing Effect */
    .typing {
      overflow: hidden;
      border-right: 3px solid var(--primary);
      white-space: nowrap;
      animation: typing 3s steps(40, end), blink-caret 0.75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }

    @keyframes blink-caret {
      from, to { border-color: transparent }
      50% { border-color: var(--primary) }
    }
  </style>
</head>
<body>
  <!-- Animated Background -->
  <div class="bg-animation"></div>
  
  <!-- Floating Particles -->
  <div class="particles" id="particles"></div>

  <!-- Background Music (Optional - User Controlled) -->
  <audio id="bgMusic">
    <source src="His.mp3" type="audio/mp3">
  </audio>

  <div class="container">
    <!-- Enhanced Sidebar -->
    <div class="sidebar">
      <div class="logo">
        <i class="fas fa-code"></i>
      </div>
      <h2>Yakay</h2>
      <p class="title">Full-Stack Developer</p>
      <p class="title typing" style="font-size: 1rem; margin-top: 10px;">Crafting Digital Excellence</p>
      
      <div class="social-links">
        <a href="https://instagram.com/im.yakay" target="_blank" class="social-link">
          <i class="fab fa-instagram"></i>
          Instagram
        </a>
        <a href="https://discord.gg/Zoretto01" target="_blank" class="social-link">
          <i class="fab fa-discord"></i>
          Zoretto01
        </a>
        <a href="mailto:dev.iamyakay@gmail.com
" class="social-link">
          <i class="fas fa-envelope"></i>
          Contact
        </a>
      </div>
    </div>

    <!-- Enhanced Main Content -->
    <div class="main">
      <div class="hero-header">
        <h1>Work. <span class="typing" style="font-weight: 400; font-size: 0.8em;">in progress</span></h1>
      </div>
      
      <div class="projects-grid" id="projectsGrid">
        <!-- Projects will be populated by JS -->
      </div>
    </div>
  </div>

  <!-- Scroll to Top -->
  <div class="scroll-indicator" onclick="scrollToTop()">
    <i class="fas fa-chevron-up"></i>
  </div>

  <script>
    // Initialize particles
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      for (let i = 0; i < 50; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 25 + 's';
        particle.style.animationDuration = (Math.random() * 20 + 15) + 's';
        particle.style.width = particle.style.height = (Math.random() * 6 + 2) + 'px';
        particlesContainer.appendChild(particle);
      }
    }

    // Enhanced project data
    const projects = [
      {
        title: "LTC Monitor",
        description: "Real-time Litecoin transaction monitoring dashboard with WebSocket integration and predictive analytics.",
        tech: ["Python", "FastAPI", "WebSocket", "Chart.js"]
      },
      {
        title: "Cookie Checker",
        description: "Advanced cookie analysis tool with security scanning, session hijacking detection, and compliance reporting.",
        tech: ["Node.js", "Puppeteer", "Express", "MongoDB"]
      },
      {
        title: "Vanity Checker",
        description: "High-performance Discord member status checker with rate limiting and proxy rotation.",
        tech: ["Python", "aiohttp", "Redis", "Docker"]
      },
      {
        title: "SMM Bot",
        description: "Enterprise-grade social media automation platform with AI content generation and analytics.",
        tech: ["Node.js", "Puppeteer", "TensorFlow.js", "PostgreSQL"]
      },
      {
        title: "Gen Bot",
        description: "Multi-functional Discord generator bot with CAPTCHA solving, account creation, and mass-messaging.",
        tech: ["Python", "discord.py", "Selenium", "Tor"]
      },
      {
        title: "NFT Marketplace",
        description: "Decentralized NFT trading platform with smart contract integration and real-time bidding.",
        tech: ["React", "Web3.js", "Solidity", "IPFS"]
      }
    ];

    // Animate projects on scroll
    function animateProjects() {
      const grid = document.getElementById('projectsGrid');
      projects.forEach((project, index) => {
        const card = document.createElement('div');
        card.className = 'project-card';
        card.style.animationDelay = `${index * 0.1}s`;
        card.innerHTML = `
          <h3>${project.title}</h3>
          <p>${project.description}</p>
          <div class="tech-stack">
            ${project.tech.map(tech => `<span class="tech-tag">${tech}</span>`).join('')}
          </div>
        `;
        card.onclick = () => addAdvancedEffect(card);
        grid.appendChild(card);
      });
    }

    // Advanced interaction effects
    function addAdvancedEffect(card) {
      card.style.transform = 'scale(0.95) rotateY(10deg)';
      setTimeout(() => {
        card.style.transform = '';
      }, 150);
      
      // Ripple effect
      const ripple = document.createElement('div');
      ripple.style.cssText = `
        position: absolute;
        border-radius: 50%;
        background: var(--primary);
        transform: scale(0);
        animation: ripple 0.6s linear;
        width: 20px;
        height: 20px;
        left: 50%;
        top: 50%;
        margin-left: -10px;
        margin-top: -10px;
      `;
      card.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }

    // Smooth scroll to top
    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Intersection Observer for scroll animations
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('animate-float');
        }
      });
    }, { threshold: 0.1 });

    // Music control
    const music = document.getElementById('bgMusic');
    let musicPlaying = false;
    document.addEventListener('click', () => {
      if (!musicPlaying) {
        music.play().catch(() => {});
        musicPlaying = true;
      }
    }, { once: true });

    // Initialize
    window.addEventListener('load', () => {
      createParticles();
      animateProjects();
      
      // Observe animated elements
      document.querySelectorAll('.project-card').forEach(card => {
        observer.observe(card);
      });
    });

    // Parallax scroll effect
    window.addEventListener('scroll', () => {
      const scrolled = window.pageYOffset;
      const parallax = document.querySelector('.bg-animation');
      const speed = scrolled * 0.5;
      parallax.style.transform = `translateY(${speed}px)`;
    });

    // Add CSS for ripple animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes ripple {
        to {
          transform: scale(4);
          opacity: 0;
        }
      }
    `;
    document.head.appendChild(style);
  </script>
</body>
</html>
